<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학교육론 임용 대비</title>
<meta name="description" content="중등 수학 임용 수학교육론 기출문제(2016~2026) 서답형 연습과 채점">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#f0ede6; --ink:#1f2328; --muted:#5f6670; --line:#dcd7cc;
  --accent:#1d5c63; --accent-ink:#ffffff; --accent-soft:#e2eeee;
  --good:#1f7a4d; --good-soft:#e3f2ea; --bad:#b3412f; --bad-soft:#f8e6e2; --warn:#9a6b00; --warn-soft:#fbf1d9;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181b; --surface:#1d2125; --surface2:#252a2f; --ink:#e7e9ea; --muted:#a2a9b1; --line:#343a40;
  --accent:#5fb3ba; --accent-ink:#0f1417; --accent-soft:#1f3337;
  --good:#5cc08c; --good-soft:#1c3328; --bad:#ec8472; --bad-soft:#3a2420; --warn:#e3b64f; --warn-soft:#3a3120;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#15181b; --surface:#1d2125; --surface2:#252a2f; --ink:#e7e9ea; --muted:#a2a9b1; --line:#343a40;
  --accent:#5fb3ba; --accent-ink:#0f1417; --accent-soft:#1f3337;
  --good:#5cc08c; --good-soft:#1c3328; --bad:#ec8472; --bad-soft:#3a2420; --warn:#e3b64f; --warn-soft:#3a3120; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:"Noto Serif KR",serif;font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
.brand small{font-family:"Noto Sans KR";font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
main{padding:24px 0 64px}
h1{font-family:"Noto Serif KR",serif;font-size:26px;line-height:1.35;margin:4px 0 8px}
h2{font-size:19px;margin:24px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
p.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:170px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.home-tile{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.home-tile:hover{border-color:var(--accent)}
.home-tile .pill{align-self:flex-start}
a{color:var(--accent)}
.home-tile .t{font-weight:700;font-size:18px}
.home-tile .d{color:var(--muted);font-size:14px}
.stat{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--surface2)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill{font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:18px;font-weight:500;margin:10px 0 14px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.result{border-left:4px solid var(--accent);padding:14px 16px;background:var(--surface2);border-radius:8px;margin-top:16px}
.result.good{border-color:var(--good)} .result.bad{border-color:var(--bad)} .result.warn{border-color:var(--warn)}
.model{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.item:hover{border-color:var(--accent)}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;padding:4px 12px;border-radius:8px;background:var(--surface2)}
.timer.over{background:var(--bad-soft);color:var(--bad)}
.timer.low{background:var(--warn-soft);color:var(--warn)}
.qimg{width:100%;max-width:760px;display:block;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.exam-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.exam-layout .left{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:76px}
@media (max-width:820px){.exam-layout{grid-template-columns:1fr}.exam-layout .left{max-height:none;position:static}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
.verify{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:10px}
.center{max-width:440px;margin:6vh auto 0}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
table.t td:nth-child(2),table.t th:nth-child(2){white-space:nowrap}
@media (max-width:640px){
  header.top .wrap{flex-wrap:wrap;gap:0;padding-top:6px}
  .brand small{display:none}
  nav.tabs{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  nav.tabs button{padding:6px 10px;white-space:nowrap}
  h1{font-size:22px}
  .card{padding:16px}
}
.blank{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:8px 12px;align-items:center;margin-bottom:10px}
.blank label{font-weight:500}
@media (max-width:640px){.blank{grid-template-columns:1fr}}
.notes-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.toc{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;padding:12px}
.toc-h{font-size:12px;font-weight:700;color:var(--muted);margin:10px 6px 4px}
.toc-i{display:block;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.toc-i:hover{background:var(--surface2)} .toc-i.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.toc-i.pend{color:var(--muted)}
.notes .sec{border-top:1px solid var(--line);padding-top:6px;margin-top:14px}
.notes .sec h3{color:var(--accent)} .notes .sub-h{font-size:14px;margin:12px 0 4px}
.notes .src-img{margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
.notes .src-img img{display:block;max-width:100%;height:auto;margin:0 auto}
.notes i{color:var(--muted);font-size:12.5px} .notes ul{padding-left:20px;margin:6px 0} .notes p{margin:6px 0}
.mobile-only{display:none}
@media (max-width:820px){.notes-layout{grid-template-columns:1fr}.toc{display:none}.mobile-only{display:block}}
footer.site{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" onclick="go('home')">수학교육론<small>임용 대비 with 또빈쌤</small></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer class="site"><div class="wrap">© 2026 또빈쌤. All rights reserved. · 기출 문항 출처: 한국교육과정평가원</div></footer>

<script src="config.js"></script>
<script src="data/exams.js"></script>
<script src="data/concepts.js"></script>
<script>
"use strict";
const CFG = Object.assign({GAS_URL:""}, window.APP_CONFIG||{});
const EXAMS = window.EXAMS||[];
const $app = document.getElementById('app');
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let USER = store.get('mt_user',null);
let TIMER = null;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function fmt(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null}}

/* ───────────── 서술형: 키워드 채점 ───────────── */
function norm(s){return String(s).toLowerCase().replace(/[\s·‧∙⋅•\-–—_,.()（）\[\]{}「」『』'"“”‘’:;!?\/~→⇒>]/g,'')}
function matchGroup(raw, n, group){
  for(const w of group){
    if(w.startsWith('re:')){ try{ if(new RegExp(w.slice(3),'i').test(raw)) return true }catch(e){} }
    else if(n.includes(norm(w))) return true;
  }
  return false;
}
function showWord(group){const w=group.find(x=>!x.startsWith('re:'));return w||'정답 형식(순서·수치)'}
function gradeEssay(text, parts){
  const n = norm(text); let score=0, max=0; const detail=[];
  for(const p of parts){
    const hits=[], miss=[];
    for(const g of p.kw){ (matchGroup(text,n,g)?hits:miss).push(showWord(g)) }
    const s = text.trim()? p.pts*hits.length/p.kw.length : 0;
    score+=s; max+=p.pts;
    detail.push({label:p.label,pts:p.pts,score:Math.round(s*10)/10,hits,miss});
  }
  return {score:Math.round(score*10)/10,max,rate:max?Math.round(100*score/max):0,detail};
}

/* ───────────── 단답형: 정확한 명칭 채점 ───────────── */
// 띄어쓰기·문장부호만 무시하고, 정답 명칭과 완전히 같을 때만 정답
const CIRCLE={'㉠':'ㄱ','㉡':'ㄴ','㉢':'ㄷ','㉣':'ㄹ','㉤':'ㅁ'};
function normShort(s,mode){
  s=String(s).trim();
  if(mode==='order') return s.replace(/[^가나다라마바]/g,'');
  if(mode==='pair') return norm(s.replace(/[㉠-㉤]/g,c=>CIRCLE[c]).replace(/\(\s*([가나다라])\s*\)/g,(m,c)=>({'가':'ㄱ','나':'ㄴ','다':'ㄷ','라':'ㄹ'})[c]));
  s=s.replace(/^(㉠|㉡|㉢|㉣|㉤|\(\s*[가나다라마]\s*\)|[ㄱㄴㄷㄹ]\s*[:.)])\s*[:.]?\s*/,''); // 앞에 붙인 기호 제거
  s=s.replace(/[.。]+$/,'');
  return norm(s);
}
function gradeShort(answers, blanks, unordered){
  const detail=[]; let score=0, max=0; const used=new Set();
  blanks.forEach((b,i)=>{
    const a=answers[i]||''; const na=normShort(a,b.mode);
    const acc=b.accept.map(x=>normShort(x,b.mode));
    let ok=false, k=-1;
    if(na){ k=acc.indexOf(na); ok=k>=0; }
    if(ok&&unordered){ // 같은 정답을 두 칸에 반복해 쓰는 경우 방지(기호 기준)
      const key=na.charAt(0); if(used.has(key)) ok=false; else used.add(key);
    }
    const pts=b.pts; if(ok) score+=pts; max+=pts;
    detail.push({label:b.label,pts:Math.round(pts*10)/10,score:ok?Math.round(pts*10)/10:0,ok,answer:a,expect:b.show?b.show:b.mode==='order'?b.accept[0].split('').map(c=>`(${c})`).join(' → '):b.accept[0]});
  });
  return {score:Math.round(score*10)/10,max:Math.round(max*10)/10,rate:max?Math.round(100*score/max):0,detail};
}

/* ───────────── 기록 전송 ───────────── */
function queue(){return store.get('mt_queue',[])}
function sendRecord(rec){
  const all = store.get('mt_hist_'+USER.sid,[]); all.push(rec); store.set('mt_hist_'+USER.sid,all);
  if(!CFG.GAS_URL) return;
  const q=queue(); q.push(rec); store.set('mt_queue',q); flushQueue();
}
let flushing=false;
async function flushQueue(){
  if(flushing||!CFG.GAS_URL) return; flushing=true;
  let q=queue();
  while(q.length){
    try{ await fetch(CFG.GAS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(q[0])}); q.shift(); store.set('mt_queue',q); }
    catch(e){ break; }
  }
  flushing=false;
}
window.addEventListener('online',flushQueue);

/* ───────────── 라우팅 ───────────── */
const TABS=[['home','홈'],['notes','내용 정리'],['quiz','개념 퀴즈'],['exam','기출문제'],['records','내 기록']];
function renderTabs(active){
  const t=document.getElementById('tabs');
  if(!USER){t.innerHTML='';return}
  t.innerHTML=TABS.map(([k,l])=>`<button class="${k===active?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+
    `<button onclick="toggleTheme()" title="화면 밝기 전환" aria-label="화면 밝기 전환">◐</button>`;
}
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');store.set('mt_theme',dark?'light':'dark')}
(function(){const t=store.get('mt_theme',null);if(t)document.documentElement.setAttribute('data-theme',t)})();
function go(view,arg){
  stopTimer(); window.scrollTo(0,0);
  if(!USER) view='login';
  renderTabs(view);
  ({login:vLogin,home:vHome,notes:vNotes,quiz:vQuizSetup,exam:vExamSetup,records:vRecords})[view](arg);
}

/* ───────────── 로그인 ───────────── */
function vLogin(){
  $app.innerHTML=`<div class="center card">
    <h1>수학교육론 임용 대비</h1>
    <p class="lead">학번과 이름을 입력하면 제출한 답안과 채점 결과가 기록됩니다.</p>
    <form onsubmit="doLogin(event)">
      <label class="f" for="sid">학번</label>
      <input type="text" id="sid" inputmode="numeric" autocomplete="off" required placeholder="예: 20231234">
      <label class="f" for="nm">이름</label>
      <input type="text" id="nm" autocomplete="off" required placeholder="예: 홍길동">
      <div class="row" style="margin-top:18px"><button class="btn primary" style="width:100%">로그인</button></div>
    </form>
    ${CFG.GAS_URL?'':'<div class="note">현재 구글 시트 주소가 설정되지 않아 기록은 이 브라우저에만 저장됩니다. (config.js의 GAS_URL)</div>'}
  </div>`;
  $('#sid').focus();
}
function doLogin(e){
  e.preventDefault();
  const sid=$('#sid').value.trim(), nm=$('#nm').value.trim();
  if(!sid||!nm){toast('학번과 이름을 모두 입력하세요.');return}
  USER={sid,name:nm}; store.set('mt_user',USER); go('home');
}
function logout(){if(!confirm('다른 학번으로 바꿀까요?'))return;USER=null;store.set('mt_user',null);go('login')}

/* ───────────── 홈 ───────────── */
function vHome(){
  const best=bestScores();
  const done=EXAMS.filter(e=>e.id in best);
  const avg=done.length?Math.round(done.reduce((a,e)=>a+best[e.id],0)/done.length):null;
  const nShort=EXAMS.filter(e=>e.kind==='short').length;
  $app.innerHTML=`
  <h1>${esc(USER.name)}, 임고 뿌셔!! 하띵 하띵!!</h1>
  <p class="lead">학번 ${esc(USER.sid)} · <a href="#" onclick="logout();return false">로그아웃</a></p>
  <div class="grid g3">
    <div class="card"><div class="muted small">푼 기출 문항</div><div class="stat">${done.length}<span class="muted small"> / ${EXAMS.length}</span></div><div class="bar"><i style="width:${100*done.length/EXAMS.length}%"></i></div></div>
    <div class="card"><div class="muted small">문항별 최고 득점률 평균</div><div class="stat">${avg===null?'–':avg+'%'}</div></div>
    <div class="card"><div class="muted small">푼 개념 퀴즈</div><div class="stat">${Object.keys(bestScores('개념퀴즈')).length}<span class="muted small"> / ${allConceptQ().length}</span></div><div class="bar"><i style="width:${100*Object.keys(bestScores('개념퀴즈')).length/Math.max(1,allConceptQ().length)}%"></i></div></div>
  </div>
  <h2>학습 메뉴</h2>
  <div class="grid g3">
    <div class="card home-tile" onclick="go('notes')"><span class="pill">내용 정리</span><div class="t">빵꾸노트 목차별 핵심 정리 ${UNITS.length}단원</div>
      <div class="d">'신론' 20단원과 '교재연구' & '성취기준' 13단원을 목차 순서대로 정리했습니다.</div></div>
    <div class="card home-tile" onclick="go('quiz')"><span class="pill">개념 퀴즈</span><div class="t">개념 설명하기 · 개념 이름 쓰기 ${allConceptQ().length}문항</div>
      <div class="d">단원을 골라 개념을 설명하거나, 설명을 읽고 개념의 이름을 정확하게 써 봅니다.</div></div>

let EQ=null;
function startExam(ids,title,asSet){
  const list=ids.map(id=>EXAMS.find(e=>e.id===id));
  EQ={list,i:0,title,asSet,results:[],setStart:Date.now(),setLimit:list.reduce((a,e)=>a+e.time*60,0)};

}
function showExam(){

  const isShort=e.kind==='short';

function submitExam(){
  if(EQ.submitted)return;
  const e=EQ.list[EQ.i], isShort=e.kind==='short';

  const miss=isShort?g.detail.filter(d=>!d.ok).map(d=>`${d.label}(정답: ${d.expect})`).join(', '):g.detail.map(d=>d.miss.join('/')).filter(Boolean).join(', ');
  sendRecord({ts:new Date().toISOString(),sid:USER.sid,name:USER.name,mode:'기출문제',qid:e.id,group:`${e.year}학년도 ${e.form} ${e.no}번`,unit:e.types.join(', '),
    question:`${e.year}학년도 ${e.form} ${e.no}번 (${isShort?'단답형':'서술형'} ${e.pts}점)`,answer:text,
    score:g.score,max:g.max,rate:g.rate,hits,miss,secs,limit:e.time*60,over:over?'Y':''});
}

const UNITS = window.CONCEPT_UNITS||[];
const PARTS=[['신론',"'신론' 빵꾸노트 목차"],['교재연구',"'교재연구' & '성취기준' 목차"]];
function unitLabel(u){return `${u.no}. ${u.title}`}
function md(s){
  const out=[];let list=null;
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<i>$2</i>');
  for(const raw of s.split('\n')){
    const l=raw.trim();
    const im=l.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
    if(im){ if(list){out.push(`<ul>${list.join('')}</ul>`);list=null}
      out.push(`<figure class="src-img"><img src="${esc(im[2])}" alt="${esc(im[1])}" loading="lazy"></figure>`); continue; }
    if(/^\*\*[^*]+\*\*$/.test(l)){ if(list){out.push(`<ul>${list.join('')}</ul>`);list=null}
      out.push(`<h4 class="sub-h">${inline(l)}</h4>`); continue; }
    if(l.startsWith('- ')){ if(!list){list=[];} list.push(`<li>${inline(l.slice(2))}</li>`); continue; }
    if(list){out.push(`<ul>${list.join('')}</ul>`);list=null}
    if(!l) continue;
    out.push(`<p>${inline(l)}</p>`);
  }
  if(list) out.push(`<ul>${list.join('')}</ul>`);
  return out.join('');
}
function unitSelectHTML(id,cur,withAll){
  return `<select id="${id}">${withAll?`<option value="">전체 단원</option>`:''}${PARTS.map(([p,lab])=>`<optgroup label="${esc(lab)}">${UNITS.filter(u=>u.part===p).map(u=>`<option value="${u.id}" ${u.id===cur?'selected':''} ${u.pending?'disabled':''}>${esc(unitLabel(u))}${u.pending?' (준비 중)':''}</option>`).join('')}</optgroup>`).join('')}</select>`;
}

function vNotes(uid){
  uid=uid||store.get('mt_note_unit',(UNITS.find(u=>!u.pending)||{}).id);
  const u=UNITS.find(x=>x.id===uid)||UNITS[0]; store.set('mt_note_unit',u.id);
  const side=PARTS.map(([p,lab])=>`<div class="toc-h">${esc(lab)}</div>${UNITS.filter(x=>x.part===p).map(x=>`<a href="#" class="toc-i ${x.id===u.id?'on':''} ${x.pending?'pend':''}" onclick="vNotes('${x.id}');return false">${esc(unitLabel(x))}${x.pending?' <span class="small">준비 중</span>':''}</a>`).join('')}`).join('');
  const body=u.pending
    ? `<div class="note">이 단원은 2022 개정 수학과 교육과정(교육부 고시 제2022-33호 [별책 8]) 원문을 바탕으로 준비 중입니다.</div>`
    : `${u.sections.map((s,i)=>`<section class="sec"><h3>${i+1}. ${esc(s.title)}</h3>${md(s.body)}</section>`).join('')}
       ${u.quiz.length?`<div class="row" style="margin-top:18px"><button class="btn primary" onclick="startConcept(UNITS.find(x=>x.id==='${u.id}').quiz.map(q=>({...q,unit:'${u.id}'})),'${esc(unitLabel(u)).replace(/'/g,'')}')">이 단원 퀴즈 풀기 (${u.quiz.length}문항)</button></div>`:''}`;
  const idx=UNITS.indexOf(u), prev=UNITS[idx-1], next=UNITS[idx+1];
  $app.innerHTML=`<h1>내용 정리</h1><p class="lead">빵꾸노트 목차를 따라 단원별 핵심 내용을 정리했습니다.</p>
  <div class="notes-layout">
    <nav class="toc card">${side}</nav>
    <div>
      <div class="mobile-only" style="margin-bottom:12px">${unitSelectHTML('nsel',u.id,false)}</div>
      <article class="card notes"><div class="muted small">${esc(u.part==='신론'?"'신론'":"'교재연구' & '성취기준'")}</div><h2 style="margin-top:4px">${esc(unitLabel(u))}</h2>${body}</article>
      <div class="row" style="margin-top:12px">${prev?`<button class="btn sm" onclick="vNotes('${prev.id}')">← ${esc(unitLabel(prev))}</button>`:''}<span class="spacer"></span>${next?`<button class="btn sm" onclick="vNotes('${next.id}')">${esc(unitLabel(next))} →</button>`:''}</div>
    </div>
  </div>`;
  const ns=$('#nsel'); if(ns) ns.onchange=()=>vNotes(ns.value);
  window.scrollTo(0,0);
}

/* ───────────── 개념 퀴즈 ───────────── */
function allConceptQ(){return UNITS.flatMap(u=>u.quiz.map(q=>({...q,unit:u.id})))}
function vQuizSetup(){
  const st=store.get('mt_qset',{unit:'',type:'전체',order:'순서대로'});
  $app.innerHTML=`<h1>개념 퀴즈</h1><p class="lead">개념을 설명하는 문항과, 설명을 읽고 개념의 이름을 쓰는 문항입니다.</p>
  <div class="card">
    <div class="grid g2">
      <div><label class="f">단원</label>${unitSelectHTML('qu',st.unit,true)}</div>
      <div><label class="f">문항 유형</label><div class="seg" id="qt">${['전체','설명','용어'].map(t=>`<button type="button" class="${t===st.type?'on':''}" data-v="${t}">${t==='설명'?'개념 설명하기':t==='용어'?'개념 이름 쓰기':'전체'}</button>`).join('')}</div>
        <label class="f">순서</label><div class="seg" id="qo">${['순서대로','무작위'].map(t=>`<button type="button" class="${t===st.order?'on':''}" data-v="${t}">${t}</button>`).join('')}</div></div>
    </div>
    <div class="row" style="margin-top:18px"><span class="muted" id="qn"></span><span class="spacer"></span><button class="btn primary" id="qgo">시작하기</button></div>
  </div>
  <div class="note"><b>채점 방식</b> — "개념 이름 쓰기"는 정확한 명칭일 때만 정답입니다(띄어쓰기·문장부호만 무시). "개념 설명하기"는 필수 키워드가 들어 있는지로 채점하는 참고용 채점입니다.</div>
  <h2>단원별 진행 현황</h2><div id="qprog"></div>`;
  const sel=()=>{const u=$('#qu').value,ty=$('#qt .on').dataset.v;return allConceptQ().filter(q=>(!u||q.unit===u)&&(ty==='전체'||q.type===ty))};
  const count=()=>$('#qn').textContent=`${sel().length}문항`;
  $('#qu').onchange=count;
  document.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{if(e.target.dataset.v){g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));count()}});
  $('#qgo').onclick=()=>{let list=sel();if(!list.length){toast('해당 문항이 없습니다.');return}
    const s={unit:$('#qu').value,type:$('#qt .on').dataset.v,order:$('#qo .on').dataset.v};store.set('mt_qset',s);
    if(s.order==='무작위')list=shuffle(list.slice());
    const u=UNITS.find(x=>x.id===s.unit);startConcept(list,u?unitLabel(u):'전체 단원')};
  count();
  const best=bestScores('개념퀴즈');
  $('#qprog').innerHTML=`<div class="card tablewrap"><table class="t"><thead><tr><th>단원</th><th>문항</th><th>푼 문항</th><th>평균</th></tr></thead><tbody>${UNITS.filter(u=>!u.pending).map(u=>{const done=u.quiz.filter(q=>q.id in best);const avg=done.length?Math.round(done.reduce((a,q)=>a+best[q.id],0)/done.length):null;
    return `<tr><td><a href="#" onclick="startConcept(UNITS.find(x=>x.id==='${u.id}').quiz.map(q=>({...q,unit:'${u.id}'})),'${esc(unitLabel(u)).replace(/'/g,'')}');return false">${esc(unitLabel(u))}</a> <span class="muted small">${u.part}</span></td><td>${u.quiz.length}</td><td>${done.length}</td><td>${avg===null?'–':avg+'%'}</td></tr>`}).join('')}</tbody></table></div>`;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let CQ=null;
function startConcept(list,title){CQ={list,i:0,title,scores:[]};renderTabs('quiz');showConcept()}
function showConcept(){
  stopTimer(); window.scrollTo(0,0);
  const c=CQ.list[CQ.i]; CQ.t0=Date.now(); CQ.done=false;
  const u=UNITS.find(x=>x.id===c.unit); const isTerm=c.type==='용어';
  $app.innerHTML=`<div class="row"><span class="pill">${isTerm?'개념 이름 쓰기':'개념 설명하기'}</span><span class="muted small">${esc(u.part)} · ${esc(unitLabel(u))}</span><span class="spacer"></span><span class="muted small">${CQ.i+1} / ${CQ.list.length}</span><span class="timer" id="tm">0:00</span></div>
  <div class="bar" style="margin:10px 0 4px"><i style="width:${100*CQ.i/CQ.list.length}%"></i></div>
  <div class="card" style="margin-top:12px">
    <div class="qtext">${esc(c.q)}</div>
    ${isTerm?`<input type="text" id="ans" placeholder="개념의 이름을 정확하게 쓰세요" autocomplete="off">`:`<textarea id="ans" placeholder="핵심 용어를 포함하여 설명하세요."></textarea>`}
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="gu">모르겠어요 (답 보기)</button><span class="spacer"></span><button class="btn primary" id="sb">제출</button></div>
    <div id="res"></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn sm ghost" onclick="go('quiz')">목록으로</button></div>`;
  const a=$('#ans');a.focus();
  a.addEventListener('keydown',e=>{if((isTerm&&e.key==='Enter')||((e.ctrlKey||e.metaKey)&&e.key==='Enter')){e.preventDefault();submitConcept(false)}});
  $('#sb').onclick=()=>submitConcept(false); $('#gu').onclick=()=>submitConcept(true);
  TIMER=setInterval(()=>{const el=$('#tm');if(el)el.textContent=fmt((Date.now()-CQ.t0)/1000)},500);
}
function submitConcept(giveUp){
  if(CQ.done) return;
  const c=CQ.list[CQ.i], u=UNITS.find(x=>x.id===c.unit), isTerm=c.type==='용어';
  const text=giveUp?'':$('#ans').value;
  if(!giveUp&&!text.trim()){toast('답안을 입력하세요.');return}
  CQ.done=true; stopTimer();
  const secs=Math.round((Date.now()-CQ.t0)/1000);
  let rate, hits='', miss='', detailHTML='';
  if(isTerm){
    const ok=!giveUp&&c.accept.map(x=>normShort(x,'name')).includes(normShort(text,'name'));
    rate=ok?100:0; if(!ok) miss=c.accept[0];
    detailHTML=giveUp?'':(ok?`<span class="chip good">✓ 정확한 명칭입니다</span>`:`<span class="chip bad">✗ ${esc(text)}</span>`);
  } else {
    const g=gradeEssay(text,[{label:'',pts:10,kw:c.kw}]); rate=giveUp?0:g.rate;
    const d=g.detail[0]; hits=d.hits.join(', '); miss=d.miss.join(', ');
    detailHTML=giveUp?'':`${d.hits.map(w=>`<span class="chip good">✓ ${esc(w)}</span>`).join('')}${d.miss.map(w=>`<span class="chip bad">✗ ${esc(w)}</span>`).join('')}`;
  }
  CQ.scores.push(rate);
  $('#ans').readOnly=true; $('#sb').disabled=true; $('#gu').disabled=true;
  const cls=rate>=80?'good':rate>=50?'warn':'bad';
  $('#res').innerHTML=`<div class="result ${cls}">
    <div class="row"><b style="font-size:18px">${giveUp?'답 보기':(isTerm?(rate?'정답':'오답'):rate+'%')}</b></div>
    ${detailHTML?`<div style="margin-top:8px">${detailHTML}</div>`:''}
    <div style="margin-top:10px"><b>${isTerm?'정답 명칭':'모범답안'}</b><div class="model">${esc(c.a)}</div></div>
    ${isTerm&&c.accept.length>1?`<div class="small muted" style="margin-top:6px">인정 답안: ${c.accept.map(esc).join(', ')}</div>`:''}
    <div class="small" style="margin-top:8px"><a href="#" onclick="go('notes','${u.id}');return false">관련 내용 정리 보기 →</a></div>
  </div>
  <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" id="nx">${CQ.i+1<CQ.list.length?'다음 문항 →':'결과 보기'}</button></div>`;
  $('#nx').focus(); $('#nx').onclick=()=>{CQ.i++;CQ.i<CQ.list.length?showConcept():conceptSummary()};
  sendRecord({ts:new Date().toISOString(),sid:USER.sid,name:USER.name,mode:'개념퀴즈',qid:c.id,group:`${u.part} ${unitLabel(u)}`,unit:isTerm?'개념 이름 쓰기':'개념 설명하기',
    question:c.q,answer:giveUp?'(모르겠어요)':text,score:rate,max:100,rate,hits,miss,secs,limit:'',over:''});
}
function conceptSummary(){
  const avg=CQ.scores.length?Math.round(CQ.scores.reduce((a,b)=>a+b,0)/CQ.scores.length):0;
  const weak=CQ.list.filter((c,i)=>CQ.scores[i]<70);
  $app.innerHTML=`<h1>${esc(CQ.title)} 퀴즈 결과</h1><div class="grid g3"><div class="card"><div class="muted small">푼 문항</div><div class="stat">${CQ.scores.length}</div></div><div class="card"><div class="muted small">평균 득점률</div><div class="stat">${avg}%</div></div><div class="card"><div class="muted small">다시 볼 문항(70% 미만)</div><div class="stat">${weak.length}</div></div></div>
  <div class="row" style="margin-top:18px">${weak.length?`<button class="btn primary" id="rw">부족한 문항 다시 풀기</button>`:''}<button class="btn" onclick="go('quiz')">다른 단원 고르기</button></div>`;
  if(weak.length)$('#rw').onclick=()=>startConcept(weak,CQ.title+' · 다시 풀기');
}

go(USER?'home':'login'); flushQueue();
</script>
</body>
