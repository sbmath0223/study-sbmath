<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학교육론 임용 대비</title>
<meta name="description" content="중등 수학 임용 수학교육론 개념학습·기출문제 서답형 연습과 키워드 채점">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --surface:#ffffff; --surface2:#f0ede6; --ink:#1f2328; --muted:#5f6670; --line:#dcd7cc;
  --accent:#1d5c63; --accent-ink:#ffffff; --accent-soft:#e2eeee;
  --good:#1f7a4d; --good-soft:#e3f2ea; --bad:#b3412f; --bad-soft:#f8e6e2; --warn:#9a6b00; --warn-soft:#fbf1d9;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181b; --surface:#1d2125; --surface2:#252a2f; --ink:#e7e9ea; --muted:#a2a9b1; --line:#343a40;
  --accent:#5fb3ba; --accent-ink:#0f1417; --accent-soft:#1f3337;
  --good:#5cc08c; --good-soft:#1c3328; --bad:#ec8472; --bad-soft:#3a2420; --warn:#e3b64f; --warn-soft:#3a3120;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#15181b; --surface:#1d2125; --surface2:#252a2f; --ink:#e7e9ea; --muted:#a2a9b1; --line:#343a40;
  --accent:#5fb3ba; --accent-ink:#0f1417; --accent-soft:#1f3337;
  --good:#5cc08c; --good-soft:#1c3328; --bad:#ec8472; --bad-soft:#3a2420; --warn:#e3b64f; --warn-soft:#3a3120; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:"Noto Serif KR",serif;font-weight:700;font-size:18px;cursor:pointer;white-space:nowrap}
.brand small{font-family:"Noto Sans KR";font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--accent-soft);color:var(--accent)}
.who{font-size:13px;color:var(--muted);white-space:nowrap}
main{padding:24px 0 64px}
h1{font-family:"Noto Serif KR",serif;font-size:26px;line-height:1.35;margin:4px 0 8px}
h2{font-size:19px;margin:24px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
p.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:170px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.home-tile{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.home-tile:hover{border-color:var(--accent)}
.home-tile .pill{align-self:flex-start}
a{color:var(--accent)}
.home-tile .t{font-weight:700;font-size:18px}
.home-tile .d{color:var(--muted);font-size:14px}
.stat{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0;border:1px solid var(--line);background:var(--surface2)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill{font-size:12px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.qtext{font-size:18px;font-weight:500;margin:10px 0 14px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.result{border-left:4px solid var(--accent);padding:14px 16px;background:var(--surface2);border-radius:8px;margin-top:16px}
.result.good{border-color:var(--good)} .result.bad{border-color:var(--bad)} .result.warn{border-color:var(--warn)}
.model{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.item:hover{border-color:var(--accent)}
.item .meta{flex:1;min-width:0}
.item .meta b{display:block}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;padding:4px 12px;border-radius:8px;background:var(--surface2)}
.timer.over{background:var(--bad-soft);color:var(--bad)}
.timer.low{background:var(--warn-soft);color:var(--warn)}
.qimg{width:100%;max-width:760px;display:block;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.exam-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.exam-layout .left{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:76px}
@media (max-width:820px){.exam-layout{grid-template-columns:1fr}.exam-layout .left{max-height:none;position:static}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
.verify{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:10px}
.center{max-width:440px;margin:6vh auto 0}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent);font-weight:500}
table.t td:nth-child(2),table.t th:nth-child(2){white-space:nowrap}
@media (max-width:640px){
  header.top .wrap{flex-wrap:wrap;gap:0;padding-top:6px}
  .brand small{display:none}
  nav.tabs{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  nav.tabs button{padding:6px 10px;white-space:nowrap}
  h1{font-size:22px}
  .card{padding:16px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" onclick="go('home')">수학교육론<small>임용 대비 서답형</small></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>

<script src="config.js"></script>
<script src="data/concepts.js"></script>
<script src="data/exams.js"></script>
<script>
"use strict";
const CFG = Object.assign({GAS_URL:"",PASS_RATE:70}, window.APP_CONFIG||{});
const CONCEPTS = window.CONCEPTS||[], EXAMS = window.EXAMS||[];
const $app = document.getElementById('app');
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let USER = store.get('mt_user',null);
let TIMER = null;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function fmt(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null}}

/* ───────────── 채점 ───────────── */
function norm(s){return String(s).toLowerCase().replace(/[\s·‧∙•\-–—_,.()（）\[\]{}「」『』'"“”‘’:;!?\/~]/g,'')}
function matchGroup(raw, n, group){
  for(const w of group){
    if(w.startsWith('re:')){ try{ if(new RegExp(w.slice(3),'i').test(raw)) return true }catch(e){} }
    else if(n.includes(norm(w))) return true;
  }
  return false;
}
function showWord(group){const w=group.find(x=>!x.startsWith('re:'));return w||'정답 형식(순서·수치)'}
function gradeParts(text, parts){
  const n = norm(text); let score=0, max=0; const detail=[];
  for(const p of parts){
    const hits=[], miss=[];
    for(const g of p.kw){ (matchGroup(text,n,g)?hits:miss).push(showWord(g)) }
    const s = text.trim()? p.pts*hits.length/p.kw.length : 0;
    score+=s; max+=p.pts;
    detail.push({label:p.label,pts:p.pts,score:Math.round(s*10)/10,hits,miss});
  }
  return {score:Math.round(score*10)/10,max,rate:max?Math.round(100*score/max):0,detail};
}

/* ───────────── 기록 전송 ───────────── */
function queue(){return store.get('mt_queue',[])}
async function sendRecord(rec){
  const all = store.get('mt_hist_'+USER.sid,[]); all.push(rec); store.set('mt_hist_'+USER.sid,all);
  if(!CFG.GAS_URL) return;
  const q=queue(); q.push(rec); store.set('mt_queue',q); flushQueue();
}
let flushing=false;
async function flushQueue(){
  if(flushing||!CFG.GAS_URL) return; flushing=true;
  let q=queue();
  while(q.length){
    try{ await fetch(CFG.GAS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(q[0])}); q.shift(); store.set('mt_queue',q); }
    catch(e){ break; }
  }
  flushing=false;
}
window.addEventListener('online',flushQueue);

/* ───────────── 라우팅 ───────────── */
const TABS=[['home','홈'],['concept','개념학습'],['exam','기출문제'],['records','내 기록']];
function renderTabs(active){
  const t=document.getElementById('tabs');
  if(!USER){t.innerHTML='';return}
  t.innerHTML=TABS.map(([k,l])=>`<button class="${k===active?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+
    `<button onclick="toggleTheme()" title="화면 밝기 전환" aria-label="화면 밝기 전환">◐</button>`;
}
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.setAttribute('data-theme',dark?'light':'dark');store.set('mt_theme',dark?'light':'dark')}
(function(){const t=store.get('mt_theme',null);if(t)document.documentElement.setAttribute('data-theme',t)})();
function go(view,arg){
  stopTimer(); window.scrollTo(0,0);
  if(!USER) view='login';
  renderTabs(view.startsWith('concept')?'concept':view.startsWith('exam')?'exam':view);
  ({login:vLogin,home:vHome,concept:vConceptSetup,exam:vExamSetup,records:vRecords})[view](arg);
}

/* ───────────── 로그인 ───────────── */
function vLogin(){
  $app.innerHTML=`<div class="center card">
    <h1>수학교육론 임용 대비</h1>
    <p class="lead">학번과 이름을 입력하면 제출한 답안과 채점 결과가 기록됩니다.</p>
    <form onsubmit="doLogin(event)">
      <label class="f" for="sid">학번</label>
      <input type="text" id="sid" inputmode="numeric" autocomplete="off" required placeholder="예: 20231234">
      <label class="f" for="nm">이름</label>
      <input type="text" id="nm" autocomplete="off" required placeholder="예: 홍길동">
      <div class="row" style="margin-top:18px"><button class="btn primary" style="width:100%">시작하기</button></div>
    </form>
    ${CFG.GAS_URL?'':'<div class="note">현재 구글 시트 주소가 설정되지 않아 기록은 이 브라우저에만 저장됩니다. (config.js의 GAS_URL)</div>'}
  </div>`;
  document.getElementById('sid').focus();
}
function doLogin(e){
  e.preventDefault();
  const sid=document.getElementById('sid').value.trim(), nm=document.getElementById('nm').value.trim();
  if(!sid||!nm){toast('학번과 이름을 모두 입력하세요.');return}
  USER={sid,name:nm}; store.set('mt_user',USER); go('home');
}
function logout(){if(!confirm('다른 학번으로 바꿀까요?'))return;USER=null;store.set('mt_user',null);go('login')}

/* ───────────── 홈 ───────────── */
function vHome(){
  const hist=store.get('mt_hist_'+USER.sid,[]);
  const cDone=new Set(hist.filter(h=>h.mode==='개념학습').map(h=>h.qid)).size;
  const eDone=new Set(hist.filter(h=>h.mode==='기출문제').map(h=>h.qid)).size;
  const review=reviewList().length;
  $app.innerHTML=`
  <div class="row"><div><h1>${esc(USER.name)} 님, 오늘도 한 문항씩.</h1>
    <p class="lead">학번 ${esc(USER.sid)} · <a href="#" onclick="logout();return false">학번 바꾸기</a></p></div></div>
  <div class="grid g3">
    <div class="card"><div class="muted small">개념학습 푼 문항</div><div class="stat">${cDone}<span class="muted small"> / ${CONCEPTS.length}</span></div><div class="bar"><i style="width:${100*cDone/CONCEPTS.length}%"></i></div></div>
    <div class="card"><div class="muted small">기출문제 푼 문항</div><div class="stat">${eDone}<span class="muted small"> / ${EXAMS.length}</span></div><div class="bar"><i style="width:${100*eDone/EXAMS.length}%"></i></div></div>
    <div class="card"><div class="muted small">복습할 개념 (${CFG.PASS_RATE}% 미만)</div><div class="stat">${review}</div>${review?`<button class="btn sm" onclick="startConcept(reviewList(),'복습')">복습 시작</button>`:'<span class="muted small">아직 없어요</span>'}</div>
  </div>
  <h2>학습 메뉴</h2>
  <div class="grid g2">
    <div class="card home-tile" onclick="go('concept')"><span class="pill">개념학습</span><div class="t">서답형 개념 퀴즈 ${CONCEPTS.length}문항</div>
      <div class="d">『수학교육신론』과 『수학교육과정과 교재연구』 목차별로 개념을 설명하거나, 설명을 읽고 용어를 쓰는 문항입니다. 필수 키워드로 채점합니다.</div></div>
    <div class="card home-tile" onclick="go('exam')"><span class="pill">기출문제</span><div class="t">2016~2026 수학교육론 ${EXAMS.length}문항</div>
      <div class="d">전공 A·B의 수학교육론(매년 24점) 문항을 이론별·연도별로 모았습니다. 제한 시간을 두고 풀고 키워드로 채점합니다.</div></div>
  </div>
  <div class="note">키워드 채점은 답안에 핵심 용어가 들어 있는지만 확인하는 참고용 채점입니다. 논리 전개와 정확성은 모범답안과 비교하여 스스로 점검하세요.</div>`;
}

/* ───────────── 개념학습 ───────────── */
function books(){return [...new Set(CONCEPTS.map(c=>c.book))]}
function vConceptSetup(){
  const bs=books();
  const st=store.get('mt_cset',{book:bs[0],ch:'',sec:'',type:'전체',order:'순서대로'});
  $app.innerHTML=`<h1>개념학습</h1><p class="lead">교재와 단원을 고른 뒤 시작하세요. 답안을 제출하면 필수 키워드 포함 여부로 채점하고 모범답안을 보여 줍니다.</p>
  <div class="card">
    <div class="grid g2">
      <div><label class="f">교재</label><select id="cb">${bs.map(b=>`<option ${b===st.book?'selected':''}>${esc(b)}</option>`).join('')}</select></div>
      <div><label class="f">장(Chapter)</label><select id="cc"></select></div>
      <div><label class="f">소단원</label><select id="cs"></select></div>
      <div><label class="f">문항 유형</label><div class="seg" id="ct">${['전체','설명','용어'].map(t=>`<button type="button" class="${t===st.type?'on':''}" data-v="${t}">${t==='설명'?'설명하기':t==='용어'?'용어 쓰기':'전체'}</button>`).join('')}</div>
        <label class="f">순서</label><div class="seg" id="co">${['순서대로','무작위'].map(t=>`<button type="button" class="${t===st.order?'on':''}" data-v="${t}">${t}</button>`).join('')}</div></div>
    </div>
    <div class="row" style="margin-top:18px"><span class="muted" id="cn"></span><span class="spacer"></span><button class="btn primary" id="cgo">시작하기</button></div>
  </div>
  <h2>목차별 진행 현황</h2><div id="cprog"></div>`;
  const cb=$('#cb'),cc=$('#cc'),cs=$('#cs');
  function fillCh(){const chs=[...new Set(CONCEPTS.filter(c=>c.book===cb.value).map(c=>c.ch))];cc.innerHTML=`<option value="">전체</option>`+chs.map(c=>`<option ${c===st.ch?'selected':''}>${esc(c)}</option>`).join('');fillSec()}
  function fillSec(){const ss=[...new Set(CONCEPTS.filter(c=>c.book===cb.value&&(!cc.value||c.ch===cc.value)).map(c=>c.sec))];cs.innerHTML=`<option value="">전체</option>`+ss.map(s=>`<option ${s===st.sec?'selected':''}>${esc(s)}</option>`).join('');count()}
  function sel(){const ty=$('#ct .on').dataset.v;return CONCEPTS.filter(c=>c.book===cb.value&&(!cc.value||c.ch===cc.value)&&(!cs.value||c.sec===cs.value)&&(ty==='전체'||c.type===ty))}
  function count(){$('#cn').textContent=`${sel().length}문항`;renderProg()}
  cb.onchange=()=>{st.ch='';st.sec='';fillCh()};cc.onchange=()=>{st.sec='';fillSec()};cs.onchange=count;
  document.querySelectorAll('.seg').forEach(g=>g.onclick=e=>{if(e.target.dataset.v){g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e.target));count()}});
  $('#cgo').onclick=()=>{let list=sel();if(!list.length){toast('해당 문항이 없습니다.');return}
    const s={book:cb.value,ch:cc.value,sec:cs.value,type:$('#ct .on').dataset.v,order:$('#co .on').dataset.v};store.set('mt_cset',s);
    if(s.order==='무작위')list=shuffle(list.slice());startConcept(list,s.sec||s.ch||s.book)};
  function renderProg(){
    const best=bestScores('개념학습');const secs=[...new Set(CONCEPTS.filter(c=>c.book===cb.value).map(c=>c.ch+'||'+c.sec))];
    $('#cprog').innerHTML=`<div class="card tablewrap"><table class="t"><thead><tr><th>소단원</th><th>문항</th><th>푼 문항</th><th>평균</th></tr></thead><tbody>${secs.map(k=>{const [ch,sc]=k.split('||');const items=CONCEPTS.filter(c=>c.book===cb.value&&c.sec===sc);const done=items.filter(c=>c.id in best);const avg=done.length?Math.round(done.reduce((a,c)=>a+best[c.id],0)/done.length):null;
      return `<tr><td><a href="#" onclick="startConcept(CONCEPTS.filter(c=>c.book===${JSON.stringify(cb.value).replace(/"/g,'&quot;')}&&c.sec===${JSON.stringify(sc).replace(/"/g,'&quot;')}),${JSON.stringify(sc).replace(/"/g,'&quot;')});return false">${esc(sc)}</a></td><td>${items.length}</td><td>${done.length}</td><td>${avg===null?'–':avg+'%'}</td></tr>`}).join('')}</tbody></table></div>`;
  }
  fillCh();
}
function $(s){return document.querySelector(s)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bestScores(mode){const b={};for(const h of store.get('mt_hist_'+USER.sid,[])){if(h.mode!==mode)continue;b[h.qid]=Math.max(b[h.qid]??-1,h.rate)}return b}
function reviewList(){if(!USER)return[];const last={};for(const h of store.get('mt_hist_'+USER.sid,[]))if(h.mode==='개념학습')last[h.qid]=h.rate;return CONCEPTS.filter(c=>c.id in last&&last[c.id]<CFG.PASS_RATE)}

let CQ=null;
function startConcept(list,title){CQ={list,i:0,title,scores:[]};renderTabs('concept');showConcept()}
function showConcept(){
  stopTimer(); window.scrollTo(0,0);
  const c=CQ.list[CQ.i]; CQ.t0=Date.now();
  const isTerm=c.type==='용어';
  $app.innerHTML=`<div class="row"><span class="pill">${isTerm?'용어 쓰기':'설명하기'}</span><span class="muted small">${esc(c.book)} · ${esc(c.sec)}</span><span class="spacer"></span><span class="muted small">${CQ.i+1} / ${CQ.list.length}</span><span class="timer" id="tm">0:00</span></div>
  <div class="bar" style="margin:10px 0 4px"><i style="width:${100*CQ.i/CQ.list.length}%"></i></div>
  <div class="card" style="margin-top:12px">
    <div class="qtext">${esc(c.q)}</div>
    ${isTerm?`<input type="text" id="ans" placeholder="용어를 쓰세요" autocomplete="off">`:`<textarea id="ans" placeholder="핵심 용어를 포함하여 서술하세요."></textarea>`}
    <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="submitConcept(true)">모르겠어요 (답 보기)</button><span class="spacer"></span><span class="muted small"><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span>로도 제출</span><button class="btn primary" onclick="submitConcept(false)">제출</button></div>
    <div id="res"></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn sm ghost" onclick="go('concept')">목록으로</button></div>`;
  const a=$('#ans');a.focus();
  a.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();submitConcept(false)}else if(isTerm&&e.key==='Enter'){e.preventDefault();submitConcept(false)}});
  TIMER=setInterval(()=>{const el=$('#tm');if(el)el.textContent=fmt((Date.now()-CQ.t0)/1000)},500);
}
function submitConcept(giveUp){
  const c=CQ.list[CQ.i]; if(CQ.done===CQ.i) return;
  const text=giveUp?'':$('#ans').value;
  if(!giveUp&&!text.trim()){toast('답안을 입력하세요.');return}
  stopTimer(); CQ.done=CQ.i;
  const secs=Math.round((Date.now()-CQ.t0)/1000);
  const g=gradeParts(text,[{label:'',pts:10,kw:c.kw}]);
  const d=g.detail[0], rate=g.rate, cls=rate>=80?'good':rate>=CFG.PASS_RATE?'warn':'bad';
  CQ.scores.push(rate);
  $('#ans').readOnly=true; document.querySelectorAll('.card .btn').forEach(b=>b.disabled=true);
  const isTerm=c.type==='용어';
  $('#res').innerHTML=`<div class="result ${cls}">
    <div class="row"><b style="font-size:18px">${giveUp?'답 보기':rate+'%'}</b><span class="muted small">${giveUp?'':(rate>=80?'핵심 키워드를 잘 갖추었습니다.':rate>=CFG.PASS_RATE?'대부분 포함했지만 빠진 요소가 있습니다.':'핵심 요소가 부족합니다. 복습 목록에 담았어요.')}</span></div>
    ${isTerm?'':`<div style="margin-top:8px">${d.hits.map(w=>`<span class="chip good">✓ ${esc(w)}</span>`).join('')}${d.miss.map(w=>`<span class="chip bad">✗ ${esc(w)}</span>`).join('')}</div>`}
    <div style="margin-top:10px"><b>${isTerm?'정답':'모범답안'}</b><div class="model">${esc(c.a)}</div></div>
    ${isTerm&&c.kw[0].length>1?`<div class="small muted" style="margin-top:6px">인정 답안: ${c.kw[0].filter(w=>!w.startsWith('re:')).map(esc).join(', ')}</div>`:''}
  </div>
  <div class="row" style="margin-top:14px"><span class="spacer"></span>${CQ.i+1<CQ.list.length?`<button class="btn primary" id="nx">다음 문항 →</button>`:`<button class="btn primary" id="nx">결과 보기</button>`}</div>`;
  const nx=$('#nx');nx.focus();nx.onclick=()=>{CQ.i++;CQ.done=null;CQ.i<CQ.list.length?showConcept():conceptSummary()};
  sendRecord({ts:new Date().toISOString(),sid:USER.sid,name:USER.name,mode:'개념학습',qid:c.id,group:c.book,unit:c.sec,question:c.q,answer:giveUp?'(모르겠어요)':text,
    score:giveUp?0:rate,max:100,rate:giveUp?0:rate,hits:d.hits.join(', '),miss:d.miss.join(', '),secs,limit:'',over:''});
}
function conceptSummary(){
  const avg=CQ.scores.length?Math.round(CQ.scores.reduce((a,b)=>a+b,0)/CQ.scores.length):0;
  const weak=CQ.list.filter((c,i)=>CQ.scores[i]<CFG.PASS_RATE);
  $app.innerHTML=`<h1>${esc(CQ.title)} 완료</h1><div class="grid g3"><div class="card"><div class="muted small">푼 문항</div><div class="stat">${CQ.scores.length}</div></div><div class="card"><div class="muted small">평균 득점률</div><div class="stat">${avg}%</div></div><div class="card"><div class="muted small">${CFG.PASS_RATE}% 미만</div><div class="stat">${weak.length}</div></div></div>
  <div class="row" style="margin-top:18px">${weak.length?`<button class="btn primary" id="rw">부족한 문항 다시 풀기</button>`:''}<button class="btn" onclick="go('concept')">다른 단원 고르기</button></div>`;
  if(weak.length)$('#rw').onclick=()=>startConcept(weak,CQ.title+' · 다시 풀기');
}

/* ───────────── 기출문제 ───────────── */
function allTypes(){const m={};EXAMS.forEach(e=>e.types.forEach(t=>m[t]=(m[t]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function vExamSetup(){
  const st=store.get('mt_eset',{by:'이론'});
  $app.innerHTML=`<h1>기출문제</h1><p class="lead">2016~2026학년도 중등 1차 전공 A·B의 수학교육론 문항(매년 24점)입니다. 문항을 누르면 제한 시간이 시작됩니다. 묶음 전체를 이어서 푸는 실전 세트도 할 수 있어요.</p>
  <div class="row"><div class="seg" id="eby">${['이론','연도'].map(t=>`<button type="button" class="${t===st.by?'on':''}" data-v="${t}">${t}별 보기</button>`).join('')}</div></div>
  <div id="elist" style="margin-top:16px"></div>
  <div class="note">문항 출처: 한국교육과정평가원 중등학교교사 임용후보자 선정경쟁시험 기출문제. 제한 시간은 시험 시간(90분/40점)을 배점에 비례해 정한 것입니다(2점 4분, 4점 9분, 10점 논술형 25분).</div>`;
  $('#eby').onclick=e=>{if(!e.target.dataset.v)return;st.by=e.target.dataset.v;store.set('mt_eset',st);$('#eby').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.by));draw()};
  function draw(){
    const best=bestScores('기출문제');
    const groups=st.by==='이론'?allTypes().map(([t])=>[t,EXAMS.filter(e=>e.types.includes(t))]):[...new Set(EXAMS.map(e=>e.year))].sort((a,b)=>b-a).map(y=>[y+'학년도',EXAMS.filter(e=>e.year===y)]);
    $('#elist').innerHTML=groups.map(([name,list],gi)=>{const tot=list.reduce((a,e)=>a+e.time,0);const pts=list.reduce((a,e)=>a+e.pts,0);
      return `<details class="card" style="margin-bottom:10px" ${gi===0?'open':''}><summary><b style="color:var(--ink)">${esc(name)}</b> <span class="muted small">· ${list.length}문항 · ${pts}점 · ${tot}분</span></summary>
      <div class="row" style="margin:12px 0"><button class="btn sm primary" onclick='startExam(${JSON.stringify(list.map(e=>e.id))},${JSON.stringify(name)},true)'>세트로 풀기 (총 ${tot}분)</button></div>
      <div class="list">${list.map(e=>`<div class="item" onclick='startExam(["${e.id}"],${JSON.stringify(name)},false)'><div class="meta"><b>${e.year}학년도 ${e.form} ${e.no}번 <span class="muted small">[${e.pts}점 · ${e.time}분]</span></b><span class="muted small">${e.types.map(esc).join(' · ')}</span></div>${e.id in best?`<span class="chip ${best[e.id]>=70?'good':best[e.id]>=40?'warn':'bad'}">최고 ${best[e.id]}%</span>`:'<span class="chip">미응시</span>'}</div>`).join('')}</div></details>`}).join('');
  }
  draw();
}
let EQ=null;
function startExam(ids,title,asSet){
  const list=ids.map(id=>EXAMS.find(e=>e.id===id));
  EQ={list,i:0,title,asSet,results:[],setStart:Date.now(),setLimit:list.reduce((a,e)=>a+e.time*60,0)};
  renderTabs('exam');showExam();
}
function showExam(){
  stopTimer(); window.scrollTo(0,0);
  const e=EQ.list[EQ.i]; EQ.t0=Date.now(); EQ.submitted=false;
  const limit=EQ.asSet?EQ.setLimit:e.time*60, start=EQ.asSet?EQ.setStart:EQ.t0;
  $app.innerHTML=`<div class="row"><span class="pill">${e.year}학년도 ${e.form} ${e.no}번</span><span class="muted small">${e.pts}점 · ${e.types.map(esc).join(' · ')}</span><span class="spacer"></span>${EQ.list.length>1?`<span class="muted small">${EQ.i+1} / ${EQ.list.length}</span>`:''}<span class="muted small">${EQ.asSet?'세트 남은 시간':'남은 시간'}</span><span class="timer" id="tm"></span></div>
  <div class="exam-layout" style="margin-top:14px">
    <div class="left"><img class="qimg" src="${e.img}" alt="${e.year}학년도 ${e.form} ${e.no}번 문항"></div>
    <div class="card"><label class="f" for="ans" style="margin-top:0">답안 작성</label>
      <textarea id="ans" style="min-height:${e.pts>=10?420:260}px" placeholder="㉠, ㉡ 등 문항이 요구하는 순서대로 쓰세요."></textarea>
      <div class="row" style="margin-top:12px"><span class="muted small" id="cc">0자</span><span class="spacer"></span><button class="btn primary" id="sb">제출하고 채점</button></div>
      <div id="res"></div></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn sm ghost" onclick="if(confirm('풀이를 그만둘까요? 제출하지 않은 답안은 기록되지 않습니다.'))go('exam')">목록으로</button></div>`;
  const a=$('#ans');a.focus();a.oninput=()=>$('#cc').textContent=a.value.length+'자';
  $('#sb').onclick=submitExam;
  const tick=()=>{const left=limit-(Date.now()-start)/1000;const el=$('#tm');if(!el)return;
    el.textContent=left>=0?fmt(left):'+'+fmt(-left);el.className='timer'+(left<0?' over':left<60?' low':'');
    if(left<0&&!EQ.warned){EQ.warned=true;toast('제한 시간이 지났습니다. 계속 쓸 수 있지만 초과 시간이 기록됩니다.',4000)}};
  tick();TIMER=setInterval(tick,500);
}
function submitExam(){
  if(EQ.submitted)return;
  const e=EQ.list[EQ.i], text=$('#ans').value;
  if(!text.trim()&&!confirm('답안이 비어 있습니다. 이대로 제출할까요?'))return;
  EQ.submitted=true; stopTimer();
  const secs=Math.round((Date.now()-EQ.t0)/1000);
  const over=EQ.asSet?(Date.now()-EQ.setStart)/1000>EQ.setLimit:secs>e.time*60;
  const g=gradeParts(text,e.parts); EQ.results.push({e,g,secs});
  $('#ans').readOnly=true;$('#sb').disabled=true;
  const cls=g.rate>=70?'good':g.rate>=40?'warn':'bad';
  $('#res').innerHTML=`<div class="result ${cls}">
    <div class="row"><b style="font-size:20px">${g.score} / ${g.max}점</b><span class="muted small">득점률 ${g.rate}% · 소요 ${fmt(secs)}${over?' · <span style="color:var(--bad)">시간 초과</span>':''}</span></div>
    <div class="tablewrap" style="margin-top:8px"><table class="t"><thead><tr><th>채점 요소</th><th>점수</th><th>키워드</th></tr></thead><tbody>
    ${g.detail.map(d=>`<tr><td>${esc(d.label)}</td><td>${d.score}/${d.pts}</td><td>${d.hits.map(w=>`<span class="chip good">✓ ${esc(w)}</span>`).join('')}${d.miss.map(w=>`<span class="chip bad">✗ ${esc(w)}</span>`).join('')}</td></tr>`).join('')}
    </tbody></table></div>
    <div style="margin-top:10px"><b>모범답안</b><div class="model">${esc(e.model)}</div></div>
    <div style="margin-top:10px"><b>해설</b><div class="model">${esc(e.explain)}</div></div>
    <div class="note">키워드는 모범답안의 핵심 용어와 동의어로 설정되어 있습니다. 표현이 달라도 의미가 맞으면 스스로 인정하고, 키워드가 있어도 논리가 틀리면 감점하여 점검하세요.</div>
  </div>
  <div class="row" style="margin-top:14px"><span class="spacer"></span><button class="btn primary" id="nx">${EQ.i+1<EQ.list.length?'다음 문항 →':'결과 보기'}</button></div>`;
  $('#nx').onclick=()=>{EQ.i++;EQ.i<EQ.list.length?showExam():examSummary()};
  sendRecord({ts:new Date().toISOString(),sid:USER.sid,name:USER.name,mode:'기출문제',qid:e.id,group:`${e.year}학년도 ${e.form} ${e.no}번`,unit:e.types.join(', '),question:`${e.year}학년도 ${e.form} ${e.no}번 (${e.pts}점)`,answer:text,
    score:g.score,max:g.max,rate:g.rate,hits:g.detail.map(d=>d.hits.join('/')).filter(Boolean).join(', '),miss:g.detail.map(d=>d.miss.join('/')).filter(Boolean).join(', '),secs,limit:e.time*60,over:over?'Y':''});
}
function examSummary(){
  const s=EQ.results.reduce((a,r)=>a+r.g.score,0), m=EQ.results.reduce((a,r)=>a+r.g.max,0), t=EQ.results.reduce((a,r)=>a+r.secs,0);
  $app.innerHTML=`<h1>${esc(EQ.title)} ${EQ.asSet?'세트 ':''}결과</h1>
  <div class="grid g3"><div class="card"><div class="muted small">총점</div><div class="stat">${Math.round(s*10)/10} / ${m}</div></div><div class="card"><div class="muted small">득점률</div><div class="stat">${m?Math.round(100*s/m):0}%</div></div><div class="card"><div class="muted small">총 소요 시간</div><div class="stat">${fmt(t)}</div><div class="muted small">제한 ${fmt(EQ.setLimit)}</div></div></div>
  <div class="card tablewrap" style="margin-top:14px"><table class="t"><thead><tr><th>문항</th><th>점수</th><th>소요</th></tr></thead><tbody>${EQ.results.map(r=>`<tr><td>${r.e.year} ${r.e.form} ${r.e.no}번</td><td>${r.g.score}/${r.g.max}</td><td>${fmt(r.secs)}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:16px"><button class="btn primary" onclick="go('exam')">기출 목록으로</button></div>`;
}

/* ───────────── 내 기록 ───────────── */
function vRecords(){
  const hist=store.get('mt_hist_'+USER.sid,[]).slice().reverse();
  const q=queue().length;
  $app.innerHTML=`<h1>내 기록</h1><p class="lead">${esc(USER.name)} (${esc(USER.sid)}) · 이 기기에서 제출한 ${hist.length}건</p>
  ${CFG.GAS_URL?`<div class="note">구글 시트 전송: ${q?`<b>${q}건 대기 중</b> <button class="btn sm" onclick="flushQueue().then(()=>go('records'))">다시 보내기</button>`:'모두 전송됨'}</div>`:`<div class="note">구글 시트 주소가 설정되지 않아 이 브라우저에만 저장됩니다.</div>`}
  <h2>이론 유형별 기출 득점률</h2><div id="bytype"></div>
  <h2>최근 제출</h2>
  <div class="card tablewrap"><table class="t"><thead><tr><th>시각</th><th>구분</th><th>문항</th><th>득점률</th><th>소요</th></tr></thead><tbody>
  ${hist.slice(0,200).map(h=>`<tr><td class="small">${new Date(h.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(h.mode)}</td><td class="small">${esc(h.mode==='기출문제'?h.group:h.unit)}<div class="muted">${esc(String(h.question).slice(0,60))}${String(h.question).length>60?'…':''}</div></td><td>${h.rate}%</td><td>${fmt(h.secs)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">아직 기록이 없습니다.</td></tr>'}
  </tbody></table></div>`;
  const best=bestScores('기출문제');
  const rows=allTypes().map(([t])=>{const list=EXAMS.filter(e=>e.types.includes(t));const done=list.filter(e=>e.id in best);return [t,list.length,done.length,done.length?Math.round(done.reduce((a,e)=>a+best[e.id],0)/done.length):null]}).filter(r=>r[2]);
  $('#bytype').innerHTML=rows.length?`<div class="card">${rows.map(([t,n,d,a])=>`<div style="margin:6px 0"><div class="row small"><span>${esc(t)}</span><span class="spacer"></span><span class="muted">${d}/${n}문항 · 평균 ${a}%</span></div><div class="bar"><i style="width:${a}%"></i></div></div>`).join('')}</div>`:'<p class="muted">기출문제를 풀면 이론별 득점률이 표시됩니다.</p>';
}

go(USER?'home':'login'); flushQueue();
</script>
</body>
</html>
